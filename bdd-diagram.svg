<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1450" viewBox="0 0 1900 1450">
  <defs>
    <style>
      .bg { fill: #f5f7fb; }
      .card { fill: #ffffff; stroke: #26364a; stroke-width: 2; rx: 10; }
      .head { fill: #26364a; }
      .subhead { fill: #e8eef7; }
      .title { fill: #ffffff; font: 700 18px Arial, sans-serif; }
      .subtitle { fill: #53657a; font: 700 13px Arial, sans-serif; }
      .field { fill: #202b38; font: 13px Consolas, monospace; }
      .type { fill: #2b6cb0; font: 13px Consolas, monospace; }
      .key { fill: #9b2c2c; font: 700 13px Consolas, monospace; }
      .note { fill: #5f6f82; font: 12px Arial, sans-serif; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; }
      .embed { stroke: #2f855a; stroke-width: 2; stroke-dasharray: 8 6; fill: none; }
      .label { fill: #334155; font: 12px Arial, sans-serif; }
      .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#2f855a"/>
    </marker>
  </defs>

  <rect class="bg" width="1900" height="1450"/>
  <text x="50" y="42" fill="#172033" font-family="Arial, sans-serif" font-size="28" font-weight="700">
    Modélisation de la base de données
  </text>
  <text x="50" y="70" class="note">MongoDB · Mongoose · 7 collections · ObjectId · sous-documents imbriqués</text>

  <!-- Relationships behind cards -->
  <path class="line" marker-end="url(#arrow)" d="M720 270 C790 270 790 250 860 250"/>
  <text class="label" x="755" y="245">category → Category._id</text>
  <path class="embed" marker-end="url(#greenArrow)" d="M390 585 C390 650 390 700 390 760"/>
  <path class="embed" marker-end="url(#greenArrow)" d="M500 585 C650 650 650 700 650 760"/>
  <path class="embed" marker-end="url(#greenArrow)" d="M610 585 C910 650 910 700 910 760"/>
  <text class="label" x="400" y="680">embedded</text>
  <text class="label" x="675" y="680">embedded</text>
  <text class="label" x="935" y="680">embedded</text>

  <!-- users -->
  <g transform="translate(50,105)">
    <rect class="card" width="600" height="480"/>
    <rect class="head" width="600" height="42" rx="10"/>
    <text class="title" x="18" y="27">users · User</text>
    <text class="note" x="455" y="27" fill="#dbeafe">_id: ObjectId</text>
    <text class="field" x="18" y="70">1. 🔑 _id</text><text class="type" x="275" y="70">ObjectId</text><text class="note" x="405" y="70">primary, generated</text>
    <text class="field" x="18" y="94">2. pseudo</text><text class="type" x="275" y="94">String</text><text class="note" x="405" y="94">required, unique</text>
    <text class="field" x="18" y="118">3. email</text><text class="type" x="275" y="118">String</text><text class="note" x="405" y="118">required, unique</text>
    <text class="field" x="18" y="142">4. password</text><text class="type" x="275" y="142">String</text><text class="note" x="405" y="142">required, hashé</text>
    <text class="field" x="18" y="166">5. role</text><text class="type" x="275" y="166">String</text><text class="note" x="405" y="166">user | admin | developper</text>
    <text class="field" x="18" y="190">6. status</text><text class="type" x="275" y="190">String</text><text class="note" x="405" y="190">active | inactive</text>
    <text class="field" x="18" y="214">7. emailVerified</text><text class="type" x="275" y="214">Boolean</text><text class="note" x="405" y="214">default: false</text>
    <text class="field" x="18" y="238">8. sessionVersion</text><text class="type" x="275" y="238">Number</text><text class="note" x="405" y="238">default: 0</text>
    <text class="field" x="18" y="262">9. isBan</text><text class="type" x="275" y="262">Boolean</text><text class="note" x="405" y="262">default: false</text>
    <text class="field" x="18" y="286">10. solde, credits</text><text class="type" x="275" y="286">Number</text><text class="note" x="405" y="286">default: 0</text>
    <text class="field" x="18" y="310">11. prj, cmd, ticket</text><text class="type" x="275" y="310">Number</text><text class="note" x="405" y="310">compteurs</text>
    <text class="field" x="18" y="334">12. createdAt, updatedAt</text><text class="type" x="275" y="334">Date</text>
    <text class="field" x="18" y="358">13. last_login, last_logout</text><text class="type" x="275" y="358">Date</text>
    <text class="field" x="18" y="382">14. orders</text><text class="type" x="275" y="382">Array&lt;Object&gt;</text><text class="note" x="405" y="382">embedded</text>
    <text class="field" x="18" y="406">15. quoteRequests</text><text class="type" x="275" y="406">Array&lt;Object&gt;</text><text class="note" x="405" y="406">embedded</text>
    <text class="field" x="18" y="430">16. ticketClient</text><text class="type" x="275" y="430">Array&lt;Object&gt;</text><text class="note" x="405" y="430">embedded</text>
    <text class="note" x="18" y="460">Tokens et dates d’expiration : select: false · banReason: String · avatar: String</text>
  </g>

  <!-- categories -->
  <g transform="translate(860,105)">
    <rect class="card" width="420" height="220"/>
    <rect class="head" width="420" height="42" rx="10"/>
    <text class="title" x="18" y="27">categories · Category</text>
    <text class="field" x="18" y="70">17. 🔑 _id</text><text class="type" x="190" y="70">ObjectId</text>
    <text class="field" x="18" y="96">18. name</text><text class="type" x="190" y="96">String</text><text class="note" x="290" y="96">required, unique</text>
    <text class="field" x="18" y="122">19. description</text><text class="type" x="190" y="122">String</text><text class="note" x="290" y="122">required</text>
    <text class="field" x="18" y="148">20. icon</text><text class="type" x="190" y="148">String</text><text class="note" x="290" y="148">required</text>
    <text class="field" x="18" y="174">21. createdAt, updatedAt</text><text class="type" x="190" y="174">Date</text>
    <text class="note" x="18" y="202">Index unique avec collation française</text>
  </g>

  <!-- services -->
  <g transform="translate(860,365)">
    <rect class="card" width="420" height="190"/>
    <rect class="head" width="420" height="42" rx="10"/>
    <text class="title" x="18" y="27">services · Service</text>
    <text class="field" x="18" y="70">22. 🔑 _id</text><text class="type" x="190" y="70">ObjectId</text>
    <text class="field" x="18" y="96">23. name</text><text class="type" x="190" y="96">String</text><text class="note" x="290" y="96">required</text>
    <text class="field" x="18" y="122">24. description</text><text class="type" x="190" y="122">String</text><text class="note" x="290" y="122">required</text>
    <text class="field" x="18" y="148">25. category</text><text class="type" x="190" y="148">ObjectId</text><text class="note" x="290" y="148">ref: Category</text>
    <text class="field" x="18" y="174">26. createdAt, updatedAt</text><text class="type" x="190" y="174">Date</text>
  </g>

  <!-- articles -->
  <g transform="translate(1330,105)">
    <rect class="card" width="420" height="220"/>
    <rect class="head" width="420" height="42" rx="10"/>
    <text class="title" x="18" y="27">articles · Article</text>
    <text class="field" x="18" y="70">27. 🔑 _id</text><text class="type" x="190" y="70">ObjectId</text>
    <text class="field" x="18" y="96">28. title</text><text class="type" x="190" y="96">String</text><text class="note" x="290" y="96">required</text>
    <text class="field" x="18" y="122">29. description</text><text class="type" x="190" y="122">String</text><text class="note" x="290" y="122">required</text>
    <text class="field" x="18" y="148">30. image</text><text class="type" x="190" y="148">String</text><text class="note" x="290" y="148">required</text>
    <text class="field" x="18" y="174">31. date, category</text><text class="type" x="190" y="174">String</text>
    <text class="field" x="18" y="200">32. createdAt</text><text class="type" x="190" y="200">Date</text>
  </g>

  <!-- projects -->
  <g transform="translate(1330,365)">
    <rect class="card" width="420" height="220"/>
    <rect class="head" width="420" height="42" rx="10"/>
    <text class="title" x="18" y="27">projects · Project</text>
    <text class="field" x="18" y="70">33. 🔑 _id</text><text class="type" x="190" y="70">ObjectId</text>
    <text class="field" x="18" y="96">34. title, description</text><text class="type" x="190" y="96">String</text><text class="note" x="290" y="96">required</text>
    <text class="field" x="18" y="122">35. imageUrl, projectType</text><text class="type" x="190" y="122">String</text>
    <text class="field" x="18" y="148">36. client, location</text><text class="type" x="190" y="148">String</text>
    <text class="field" x="18" y="174">37. budget, duration, result</text><text class="type" x="190" y="174">String</text>
    <text class="field" x="18" y="200">38. createdAt</text><text class="type" x="190" y="200">Date</text>
  </g>

  <!-- embedded documents -->
  <g transform="translate(50,760)">
    <rect class="card" width="600" height="320"/>
    <rect class="subhead" width="600" height="38" rx="10"/>
    <text class="subtitle" x="18" y="25">Sous-documents de users</text>
    <text class="field" x="18" y="68">39. orders</text><text class="type" x="210" y="68">Array&lt;Object&gt;</text>
    <text class="note" x="18" y="92">id:String · name:String · description:String · client_name:String</text>
    <text class="note" x="18" y="114">price:Number · quantity:Number · total_price:Number</text>
    <text class="note" x="18" y="136">status:String · created_at:Date · updated_at:Date</text>
    <text class="field" x="18" y="176">40. quoteRequests</text><text class="type" x="210" y="176">Array&lt;Object&gt;</text>
    <text class="note" x="18" y="200">title:String · description:String · service:String · budget:Number</text>
    <text class="note" x="18" y="222">desiredDate:Date · status:String · adminNote:String</text>
    <text class="note" x="18" y="244">createdAt:Date · updatedAt:Date</text>
    <text class="field" x="18" y="284">41. ticketClient</text><text class="type" x="210" y="284">Array&lt;Object&gt;</text>
    <text class="note" x="18" y="306">title:String · email:String · message:String · status:String · replies:Array&lt;Object&gt;</text>
  </g>

  <!-- newsletter -->
  <g transform="translate(700,760)">
    <rect class="card" width="420" height="180"/>
    <rect class="head" width="420" height="42" rx="10"/>
    <text class="title" x="18" y="27">newletters · NewLetter</text>
    <text class="field" x="18" y="70">42. 🔑 _id</text><text class="type" x="190" y="70">ObjectId</text>
    <text class="field" x="18" y="96">43. email</text><text class="type" x="190" y="96">String</text><text class="note" x="290" y="96">required, unique</text>
    <text class="field" x="18" y="122">44. subscribed</text><text class="type" x="190" y="122">Boolean</text><text class="note" x="290" y="122">default: true</text>
    <text class="field" x="18" y="148">45. createdAt, updatedAt</text><text class="type" x="190" y="148">Date</text>
  </g>

  <!-- activity logs -->
  <g transform="translate(1200,760)">
    <rect class="card" width="550" height="210"/>
    <rect class="head" width="550" height="42" rx="10"/>
    <text class="title" x="18" y="27">activitylogs · ActivityLog</text>
    <text class="field" x="18" y="70">46. 🔑 _id</text><text class="type" x="230" y="70">ObjectId</text>
    <text class="field" x="18" y="96">47. type</text><text class="type" x="230" y="96">String</text><text class="note" x="330" y="96">security | auth | system | content | user</text>
    <text class="field" x="18" y="122">48. action, description, actor</text><text class="type" x="230" y="122">String</text>
    <text class="field" x="18" y="148">49. metadata</text><text class="type" x="230" y="148">Mixed</text>
    <text class="field" x="18" y="174">50. createdAt</text><text class="type" x="230" y="174">Date</text><text class="note" x="330" y="174">index</text>
  </g>

  <!-- legend -->
  <g transform="translate(700,1030)">
    <rect class="legend" width="1050" height="105"/>
    <text class="subtitle" x="20" y="25">Légende</text>
    <text class="field" x="20" y="52">51. 🔑</text><text class="note" x="45" y="52">clé primaire MongoDB</text>
    <line class="line" x1="220" y1="48" x2="280" y2="48" marker-end="url(#arrow)"/><text class="note" x="295" y="52">référence ObjectId</text>
    <line class="embed" x1="470" y1="48" x2="530" y2="48" marker-end="url(#greenArrow)"/><text class="note" x="545" y="52">sous-document imbriqué</text>
    <text class="note" x="20" y="82">Types : String, Number, Boolean, Date, ObjectId, Mixed et Array&lt;Object&gt;</text>
  </g>

  <text x="50" y="1405" class="note">Diagramme généré depuis bd.json · Les commandes, devis, tickets et réponses sont embarqués dans users.</text>
</svg>
