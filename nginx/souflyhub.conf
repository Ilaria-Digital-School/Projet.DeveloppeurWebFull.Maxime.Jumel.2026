# /etc/nginx/sites-available/souflyhub.conf  (puis lien dans sites-enabled)
# Frontend Next.js -> 127.0.0.1:3000
server {
    listen 80;
    server_name souflyhub.dev www.souflyhub.dev;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API Express -> 127.0.0.1:3222 (port publie par docker-compose)
server {
    listen 80;
    server_name api.souflyhub.dev;

    location / {
        proxy_pass http://127.0.0.1:3222;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
