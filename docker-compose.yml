services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: souflydev-nextjs
    expose:
      - "3000"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: souflydev-nginx
    depends_on:
      - nextjs
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: souflydev-cloudflared
    depends_on:
      - nginx
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    restart: unless-stopped
