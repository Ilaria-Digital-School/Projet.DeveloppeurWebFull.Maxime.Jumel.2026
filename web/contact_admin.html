<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        .btn i{
            font-size: 20px;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        .dropdown-item i{
            font-size: 18px;
        }
        .dropdown-item{
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .dropdown-item{
            border-radius: 5px;
        }
        .table-dark{
            padding: 10px;
        }
        @media (max-width: 992px){
            .navbar-nav{
                flex-direction: column;
            }
        
        .navbar-brand{
            font-size: 24px;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        .dropdown-item::selection{
            background-color: #000;
        }
        .dropdown-item:hover{
            background-color: #000;
        }
        .dropdown-item:active{
            background-color: #000;
        }
        .table-responsive{
            height: 500px;
            overflow-y: auto;
        }
        .table-responsive table{
            width: 100%;
            border-collapse: collapse;
        }
        .table-responsive thead{
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .table-responsive tbody{
            overflow-y: auto;
        }
        .table-responsive thead::-webkit-scrollbar{
            display: none;
        }
        .table-responsive tbody::-webkit-scrollbar{
            display: none;
        }
        .badge{
            font-size: 18px;
        }
        }
    </style>
</head>

<body class="container-fluid bg-white w-100 mx-auto p-0 m-0 border-0">
    
<nav class="navbar navbar-expand-lg bg-body-tertiary text-white ">
  <div class="container-fluid  w-100 mx-auto ">
    <a class="navbar-brand fs-4 mx-4 text-dark fw-bold" href="#">Maxime Jumel</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 mx-2">
        <li class="nav-item">
          <a class="nav-link active text-dark" aria-current="page" href="#"><i class="bi bi-house-door-fill text-dark"></i> Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="#"><i class="bi bi-person-fill text-dark"></i> About</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle text-dark" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-folder-fill text-dark"></i> Projects
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#"><i class="bi bi-plus-circle text-dark"></i> New project</a></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-pencil-square text-dark"></i> Edit project</a></li>
            <li><hr class="dropdown-divider"></li>
            <li>
                <form class="d-flex my-3 mx-3 " role="search">
                    <input class="form-control me-2 text-dark" type="search" placeholder="Search" aria-label="Search"/>
                    <button class="btn btn-outline-success text-dark" type="submit"><i class="bi bi-search"></i></button>
                </form>
            </li>
          </ul>
        </li>
        
      </ul>
      <ul class="d-flex align-items-center ms-auto gap-5">
        <li class="nav-item">
            <a class="nav-link d-flex align-items-center fs-4 gap-2 text-dark" href=""><i class="bi bi-person-circle fs-4 text-dark"></i>Admin</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-dark fs-4 mx-2" href=""><i class="bi bi-box-arrow-right fs-4 text-dark"></i>Logout</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<section class="container-fluid bg-white w-100 mx-auto p-0 m-0 border-0">

    <section class="table table-striped table-bordered w-100 mx-auto p-0 m-0 border-0 my-4 border-dark table-dark">
        <table class="table table-striped table-bordered w-100 mx-auto p-0 m-0 border-0 table-dark text-white w-100 mx-auto p-0 m-0 border-0">
          <thead class="w-100 mx-auto p-0 m-0 border-0 text-white bg-dark">
            <tr class="text-center fw-bold">
              <th class="text-center col-1 fw-bold bg-dark">ID</th>
              <th class="text-center col-2 fw-bold bg-dark">Nom</th>
              <th class="text-center col-2 fw-bold bg-dark">Email</th>
              <th class="text-center col-2 fw-bold bg-dark">Object</th>
              <th class="text-center col-3 fw-bold bg-dark">Message</th>
              <th class="text-center col-1 fw-bold bg-dark">Status</th>
              <th class="text-center col-1 fw-bold bg-dark">Action</th>
            </tr>
          </thead>
          <tbody class="w-100 mx-auto p-0 m-0 border-0">
            <tr class="text-center">
              <td class="text-center col-1">1</td>
              <td class="text-center col-2">Nom</td>
              <td class="text-center col-2">Email</td>
              <td class="text-center col-2">Object</td>
              <td class="text-center col-3">Message</td>
              <td class="text-center col-2">
                <span class="badge bg-success">Read</span>
              </td>
              <td class="text-center col-1 d-flex gap-2 justify-content-center">
                <button class="btn btn-sm btn-outline-danger text-dark" type="submit"><i class="bi bi-trash text-white fs-4"></i></button>
                <button class="btn btn-sm btn-outline-secondary text-dark" type="submit"><i class="bi bi-exclamation-triangle text-white fs-4"></i></button>
                <button class="btn btn-sm btn-outline-primary text-dark" type="submit"><i class="bi bi-envelope-open text-white fs-4"></i></button>
                <button class="btn btn-sm btn-outline-warning text-dark" type="submit"><i class="bi bi-telephone-outbound-fill text-white fs-4"></i></button>
            </td>
            </tr>
            <tr class="text-center">
              <td class="text-center col-1">2</td>
              <td class="text-center col-2">Nom</td>
              <td class="text-center col-2">Email</td>
              <td class="text-center col-2">Object</td>
              <td class="text-center col-3">Message</td>
                <td class="text-center col-1">
                    <span class="badge bg-danger">Unread</span>
                </td>
                <td class="text-center col-1 d-flex gap-2 justify-content-center">
                    <button class="btn btn-sm btn-outline-danger text-dark" type="submit"><i class="bi bi-trash text-white fs-4"></i></button>
                    <button class="btn btn-sm btn-outline-secondary text-dark" type="submit"><i class="bi bi-exclamation-triangle text-white fs-4"></i></button>
                    <button class="btn btn-sm btn-outline-primary text-dark" type="submit"><i class="bi bi-envelope-open text-white fs-4"></i></button>
                    <button class="btn btn-sm btn-outline-warning text-dark" type="submit"><i class="bi bi-telephone-outbound-fill text-white fs-4"></i></button>
                </td>
            </tr>
            
          </tbody>
        </table>
    </section>

</section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
