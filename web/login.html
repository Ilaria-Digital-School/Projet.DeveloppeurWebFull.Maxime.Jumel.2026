<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soulfydev - Login</title>
  <link rel="stylesheet" href="../assets/css/_login.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">


</head>

<body class=" bg-black d-flex align-items-center justify-content-center">

    <div class="login-container">
        <!-- Back Link -->
        <div class="mb-4">
            <a href="../index.html" class="back-link">
                <i class="bi bi-arrow-left"></i> Retour à l'accueil
            </a>
        </div>

        <!-- Card wrapper -->
        <main class="login-card text-center">
            <div class="mb-4">
                <img src="../assets/images/upload/soulfydev.png" class="brand-logo mb-3" alt="Soulfydev Logo">
                <h1 class="h3 font-weight-bold text-light mb-1">Connexion</h1>
                <p class="text-light small pt-4">Accédez à votre tableau de bord Soulfydev</p>
                <div><a href="./register.html" class="back-link">
                    <i class="bi bi-arrow-left"></i> Inscrivez-vous
                </a></div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-3 text-start">
                    <label for="inputEmail" class="form-label text-light small font-weight-bold">Adresse Email</label>
                    <input type="email" class="form-control form-control-custom" id="inputEmail" placeholder="nom@exemple.com" required autocomplete="email" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="inputPassword" class="form-label text-light small font-weight-bold">Mot de passe</label>
                    <input type="password" class="form-control form-control-custom" id="inputPassword" placeholder="••••••••" required autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-login btn-primary w-100 text-light uppercase">Se connecter</button>
            </form>
        </main>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
</body>

</html>
