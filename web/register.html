<body class=" bg-black d-flex align-items-center justify-content-center">
<main class="login-container">
        <!-- Back Link -->
        <div class="mb-4">
            <a href="../index.html" class="back-link">
                <i class="bi bi-arrow-left"></i> Back to home
            </a>
        </div>

        <!-- Card wrapper -->
        <section class="login-card text-center">
            <div class="mb-4">
                <img src="../assets/images/upload/soulfydev.webp" class="brand-logo mb-3" alt="Soulfydev Logo">
                <h1 class="h3 font-weight-bold text-light mb-1">Sign up</h1>
                <p class="text-light small pt-4">Access your Soulfydev dashboard</p>
                <div><a href="./login.html" class="back-link">
                    <i class="bi bi-arrow-right"></i> Login
                </a></div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-3 text-start">
                    <label for="inputPseudo" class="form-label text-light small font-weight-bold">Pseudo</label>
                    <input type="text" class="form-control form-control-custom" id="inputPseudo" placeholder="Pseudo"  autocomplete="name" required>
                </div>
                
                <div class="mb-3 text-start">
                    <label for="inputEmail" class="form-label text-light small font-weight-bold">Adresse Email</label>
                    <input type="email" class="form-control form-control-custom" id="inputEmail" placeholder="nom@exemple.com" aria-label="Adresse Email"  autocomplete="email" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="inputPassword" class="form-label text-light small font-weight-bold">Mot de passe</label>
                    <input type="password" class="form-control form-control-custom" id="inputPassword" placeholder="••••••••" aria-label="Mot de passe" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-login btn-primary w-100 text-light uppercase">Se connecter</button>
            </form>
        </section>
    </div>
</main>

<footer class="text-center mt-4">
