  <style>
    
    body {
      background: #0f0f0f;
      min-height: 100vh;
      font-family: 'Poppins', system-ui, sans-serif;
    }
    
    .login-container {
      max-width: 450px;
      width: 100%;
      padding: 2rem;
    }

    .login-card {
      background: rgba(25, 29, 37, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      padding: 2.5rem;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      box-shadow: 0 25px 50px -12px rgba(0, 59, 253, 0.15);
    }

    .brand-logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(0, 59, 253, 0.5);
      box-shadow: 0 0 20px rgba(0, 59, 253, 0.3);
      object-fit: cover;
    }

    .form-control-custom {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #fff !important;
      border-radius: 12px;
      padding: 0.75rem 1rem;
      transition: all 0.2s ease;
    }

    .form-control-custom:focus {
      border-color: #003bfd !important;
      box-shadow: 0 0 0 3px rgba(0, 59, 253, 0.25) !important;
      outline: none;
    }

    .btn-login {
      background: linear-gradient(135deg, #003bfd 0%, #1d4ed8 100%);
      border: none;
      border-radius: 12px;
      padding: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 59, 253, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 59, 253, 0.5);
      background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
    }

    .back-link {
      color: #9ca3af;
      transition: color 0.2s ease;
      font-size: 0.9rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .back-link:hover {
      color: #fff;
    }
  </style>
</head>

<body class="d-flex align-items-center justify-content-center">

    <div class="login-container">
        <!-- Back Link -->
        <div class="mb-4">
            <a href="./index.html" class="back-link">
                <i class="bi bi-arrow-left"></i> Retour à l'accueil
            </a>
        </div>

        <!-- Card wrapper -->
        <main class="login-card text-center">
            <div class="mb-4">
                <img src="./assets/images/upload/soulfydev.png" class="brand-logo mb-3" alt="Soulfydev Logo">
                <h1 class="h3 font-weight-bold text-light mb-1">Connexion</h1>
                <p class="text-light small pt-4">Accédez à votre tableau de bord Soulfydev</p>
                <div><a href="./login.html" class="back-link">
                    <i class="bi bi-arrow-right"></i> Connectez-vous
                </a></div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="mb-3 text-start">
                    <label for="inputPseudo" class="form-label text-light small font-weight-bold">Pseudo</label>
                    <input type="text" class="form-control form-control-custom" id="inputPseudo" placeholder="Pseudo" required autocomplete="name" required>
                </div>
                
                <div class="mb-3 text-start">
                    <label for="inputEmail" class="form-label text-light small font-weight-bold">Adresse Email</label>
                    <input type="email" class="form-control form-control-custom" id="inputEmail" placeholder="nom@exemple.com" required autocomplete="email" required>
                </div>
                <div class="mb-4 text-start">
                    <label for="inputPassword" class="form-label text-light small font-weight-bold">Mot de passe</label>
                    <input type="password" class="form-control form-control-custom" id="inputPassword" placeholder="••••••••" required autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-login btn-primary w-100 text-light uppercase">Se connecter</button>
            </form>
        </main>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const email = localStorage.getItem("email");
        const password = localStorage.getItem("password");

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const emailInput = document.getElementById("inputEmail").value;
            const passwordInput = document.getElementById("inputPassword").value;

            if (emailInput === email && passwordInput === password) {
                window.location.href = "./"
            } else {
                Swal.fire({
                    title: "Erreur",
                    text: "Email ou mot de passe incorrect",
                    icon: "error",
                    confirmButtonText: "OK"
                })
            }
        })
    </script>
</body>
